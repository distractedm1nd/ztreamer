zakura-state = { git = "https://github.com/distractedm1nd/zakura.git", branch = "expose-api" }
zakura-test = { git = "https://github.com/distractedm1nd/zakura.git", branch = "expose-api" }
zakurad = { package = "zakura", git = "https://github.com/distractedm1nd/zakura.git", branch = "expose-api", default-features = false }
zakura-node-services = { git = "https://github.com/distractedm1nd/zakura.git", branch = "expose-api" }
