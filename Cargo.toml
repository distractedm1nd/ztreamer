[workspace]
resolver = "3"
members = ["bin/ztreamerd", "crates/indexer", "crates/node", "crates/protocol", "crates/service"]

[workspace.dependencies]
zakura-chain = { git = "https://github.com/distractedm1nd/zakura.git", branch = "expose-api" }
