[package]
name = "ztreamer-indexer"
version = "0.0.1"
edition = "2024"

[dependencies]
bincode = "1.3"
heed = { version = "0.22.1", default-features = false }
hex = "0.4"
metrics = "0.24"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tonic = "0.14.6"
tracing = "0.1"
zakura-chain.workspace = true
zakura-state = { workspace = true, features = ["indexer"] }
ztreamer-node = { path = "../node" }

[dev-dependencies]
criterion = "0.7"
tempfile = "3"
zakura-test.workspace = true

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "codec"
harness = false
